<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FBF4E4">
<title>Creator — Pairoobot</title>
<meta name="description" content="Every coin a creator launched through Pairoobot, and whether they are live.">
<meta property="og:title" content="Pairoobot creator">
<meta property="og:description" content="Every coin one creator launched, and whether the stream is up.">
<meta property="og:image" content="https://www.pairoo.xyz/assets/og-soft.webp">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF4E4;--paper-2:#F5ECD7;--yellow:#FFC91E;--yellow-soft:#FFE9A6;--ink:#14161A;--ink-70:rgba(20,22,26,.7);--ink-45:rgba(20,22,26,.6);--hair:rgba(20,22,26,.14);--hair-2:rgba(20,22,26,.26);--live:#E5484D;--disp:'Archivo Black',Impact,'Arial Black',sans-serif;--sans:Archivo,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15.5px/1.7 var(--sans);font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.wrap{width:min(1180px,calc(100% - 48px));margin:auto}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:400;letter-spacing:-.035em;line-height:1}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-45)}
.mono{font-family:var(--mono)}
header{position:sticky;top:0;z-index:60;background:rgba(251,244,228,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.head-in{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{position:relative;display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:19px;letter-spacing:-.045em}
.brand img.mk{width:26px;height:26px;display:block}
.brand .crown{position:absolute;left:17px;top:-11px;width:21px;opacity:.75;transform:rotate(-8deg)}
nav{display:flex;align-items:center;gap:26px}
nav a.nav-link{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-70)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:1px solid var(--ink);border-radius:2px;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11px;letter-spacing:.1em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--hair-2)}
.btn.ghost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip{display:inline-block;font-family:var(--disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--live);border:2px solid var(--live);border-radius:3px;padding:2px 6px;vertical-align:3px;margin-left:10px}

.id{display:grid;grid-template-columns:400px 1fr;gap:56px;align-items:start;padding:60px 0 20px}
.card{position:relative;transform:rotate(1.5deg)}
.card .body{background:var(--ink);color:var(--paper);border-radius:12px;padding:26px;box-shadow:8px 10px 0 var(--yellow);min-height:460px;display:flex;flex-direction:column;justify-content:space-between}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .top .lab{color:rgba(251,244,228,.5)}
.card .nm{font-family:var(--disp);font-size:clamp(34px,4.4vw,54px);letter-spacing:-.05em;line-height:.95;word-break:break-word}
.card .at{font-family:var(--mono);font-size:16px;color:var(--yellow);margin-top:10px;word-break:break-all}
.card .since{font-size:14px;color:rgba(251,244,228,.65);margin-top:14px}
.card .nums{display:flex;border-top:1px solid rgba(251,244,228,.24);padding-top:18px}
.card .nums div{flex:1;padding-left:18px;border-left:1px solid rgba(251,244,228,.24)}
.card .nums div:first-child{padding-left:0;border-left:0}
.card .nums .lab{color:rgba(251,244,228,.5)}
.card .nums b{display:block;font-family:var(--disp);font-size:32px;font-weight:400;margin-top:6px}
.card .bird{position:absolute;right:-64px;bottom:-36px;height:190px;transform:rotate(8deg);pointer-events:none}
h1{font-size:clamp(36px,6vw,76px);line-height:.98;margin-top:16px}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--yellow) 62%)}
.sub{font-size:17px;max-width:46ch;color:var(--ink-70);margin:22px 0 0}
.cta{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}

.sec{padding:64px 0 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--hair-2);margin-bottom:30px}
.sec-head h2{font-size:clamp(24px,3.4vw,38px);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.stub{position:relative;background:var(--paper-2);border:1px solid var(--hair-2);border-radius:10px;padding:18px;box-shadow:6px 8px 0 var(--ink)}
.stub:nth-child(odd){transform:rotate(-1deg)}
.stub:nth-child(even){transform:rotate(1deg)}
.stub:hover{box-shadow:6px 8px 0 var(--yellow)}
.stub .top{display:flex;justify-content:space-between;align-items:center;min-height:24px}
.stub img.face{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--hair-2);margin-top:12px;display:block;background:var(--paper)}
.stub .tear{border-top:2px dashed rgba(20,22,26,.35);margin:14px -18px 12px}
.stub .t{font-family:var(--disp);font-size:28px;letter-spacing:-.04em;word-break:break-all}
.stub .m{font-size:13.5px;color:var(--ink-70)}
.next{border:2px dashed var(--hair-2);border-radius:10px;padding:18px;display:grid;place-items:center;text-align:center;color:var(--ink-45);min-height:200px}
.next b{display:block;font-family:var(--disp);font-size:22px;letter-spacing:-.04em;color:var(--ink)}
.void{padding:70px 0;text-align:center}
.void b{display:block;font-family:var(--disp);font-size:clamp(22px,3.2vw,34px);letter-spacing:-.04em;margin-bottom:12px}
.void span{font-family:var(--mono);font-size:11.5px;opacity:.6}
.end{padding:96px 0 100px;text-align:center}
.end h2{font-size:clamp(30px,4.6vw,54px);margin-bottom:14px}
.end .swash{display:block;width:min(240px,52%);margin:0 auto 30px;opacity:.7}
footer{border-top:1px solid var(--hair);padding:28px 0 46px}
.foot-in{display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-45)}
.foot-links{display:flex;flex-wrap:wrap;gap:16px}
[hidden]{display:none!important}
@media (max-width:900px){.id{grid-template-columns:1fr;gap:34px;padding-top:36px}.card{transform:none;max-width:400px}.card .bird{display:none}nav .nav-link{display:none}}
@media (prefers-reduced-motion:reduce){.stub:nth-child(odd),.stub:nth-child(even),.card{transform:none}}
</style>
</head>
<body>
<header><div class="wrap head-in">
  <a class="brand" href="/"><img class="crown" src="/assets/mark-crown.webp" alt=""><img class="mk" src="/assets/mark.webp" alt="" width="30" height="30">Pairoobot</a>
  <nav><a class="nav-link" href="/board">Board</a><a class="nav-link" href="/#pairs">Pairs</a><a class="btn" href="https://t.me/pairoobot" target="_blank" rel="noopener noreferrer">@pairoobot</a></nav>
</div></header>

<main class="wrap">
  <section id="loading" class="void"><b>Reading the feed…</b></section>
  <section id="missing" class="void" hidden><b>No such creator.</b><span>nothing is shown that we cannot vouch for</span><div style="margin-top:24px"><a class="btn ghost" href="/board">The board</a></div></section>
  <div id="creator" hidden>
    <section class="id">
      <div class="card">
        <div class="body">
          <div class="top"><span class="lab">CREATOR CARD</span><img id="chan-icon" alt="" style="width:22px;height:22px;border-radius:4px" hidden></div>
          <div>
            <div class="nm" id="nm">—</div>
            <div class="at" id="at"></div>
            <div class="since" id="since"></div>
          </div>
          <div class="nums">
            <div><span class="lab">COINS</span><b id="n-coins">—</b></div>
            <div><span class="lab">GRADUATED</span><b id="n-grad">—</b></div>
            <div><span class="lab">ON AIR</span><b id="n-live" style="color:var(--live)">—</b></div>
          </div>
        </div>
        <img class="bird" src="/assets/bird-clean.webp" alt="">
      </div>
      <div style="padding-top:14px">
        <div class="lab" id="kicker">CREATOR</div>
        <h1 id="headline">—</h1>
        <p class="sub" id="sub"></p>
        <div class="cta" id="cta"></div>
      </div>
    </section>
    <section class="sec">
      <div class="sec-head"><div><span class="lab">01</span><h2>Coins</h2></div><span class="lab">NEWEST FIRST</span></div>
      <div class="grid" id="coins"></div>
    </section>
    <section class="end"><h2>Same bird<br>bigger ideas</h2><img class="swash" src="/assets/mark-swash.webp" alt=""><a class="btn" href="https://t.me/pairoobot" target="_blank" rel="noopener noreferrer">Launch yours</a></section>
  </div>
</main>

<footer><div class="wrap foot-in">
  <span>© 2026 Pairoobot</span>
  <div class="foot-links"><a href="/pairoo/terms">Terms</a><a href="/pairoo/privacy">Privacy</a><a href="/pairoo/data-deletion">Data deletion</a><a href="https://t.me/pairoobot" target="_blank" rel="noopener noreferrer">Telegram @pairoobot</a></div>
</div></footer>

<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const show = (id) => { for (const s of ['loading', 'missing', 'creator']) $(s).hidden = s !== id; };
const id = (/^\/creator\/([a-f0-9]{12})\/?$/.exec(location.pathname) || [])[1] || new URLSearchParams(location.search).get('id');
const ICON = { discord: 'discord', telegram: 'telegram', x: 'x' };

async function main() {
  if (!id) { show('missing'); return; }
  let cr, feed;
  try {
    [cr, feed] = await Promise.all([
      fetch('/pairoo/api/creators.json', { cache: 'no-store' }).then((r) => r.json()),
      fetch('/pairoo/api/coins.json', { cache: 'no-store' }).then((r) => r.json()),
    ]);
  } catch { show('missing'); return; }
  const c = (cr.creators || []).find((x) => x.id === id);
  if (!c) { show('missing'); return; }
  const coins = (feed.coins || []).filter((k) => c.coins.includes(k.mint)).sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
  const onAir = coins.filter((k) => k.stream).length;
  const grad = coins.filter((k) => k.graduated).length;
  const name = c.display || c.label;

  document.title = `${name} — Pairoobot`;
  $('nm').textContent = name;
  $('at').textContent = c.label && c.label !== name ? c.label : '';
  const since = c.since ? new Date(c.since * 1000).toLocaleDateString('en-US', { dateStyle: 'medium' }) : null;
  $('since').textContent = [c.channel ? `Launches from ${c.channel}` : null, since ? `since ${since}` : null].filter(Boolean).join(' ') + '.';
  $('n-coins').textContent = coins.length;
  $('n-grad').textContent = grad;
  $('n-live').textContent = onAir;
  if (ICON[c.channel]) { $('chan-icon').src = `/assets/icon-${ICON[c.channel]}.webp`; $('chan-icon').hidden = false; }

  $('kicker').textContent = `CREATOR · ${String(c.channel || '').toUpperCase()}`;
  const word = coins.length === 1 ? 'One coin' : `${coins.length} coins`;
  $('headline').innerHTML = onAir ? `${esc(word)}.<br>One <em>on air</em>.` : `${esc(word)}.<br>None <em>on air</em> yet.`;
  $('sub').textContent = `Everything ${name} launched through Pairoobot, and whether the stream is up right now. `
    + 'The name comes from the network they spoke to the bot on; nothing else about them is kept here.';
  const cta = $('cta'); cta.innerHTML = '';
  const first = coins.find((k) => k.stream);
  if (first) { const a = document.createElement('a'); a.className = 'btn'; a.href = '/coin/' + first.mint; a.textContent = 'Watch the live'; cta.appendChild(a); }
  const sh = document.createElement('button'); sh.className = 'btn ghost'; sh.type = 'button'; sh.textContent = 'Share creator';
  sh.addEventListener('click', () => navigator.clipboard.writeText(location.origin + '/creator/' + id).then(() => { sh.textContent = 'copied'; setTimeout(() => (sh.textContent = 'Share creator'), 1400); }));
  cta.appendChild(sh);

  $('coins').innerHTML = coins.map((k, i) => {
    const pct = k.bonding_progress == null ? null : Math.round(k.bonding_progress * 100);
    return `<a class="stub" href="/coin/${encodeURIComponent(k.mint)}">
      <div class="top"><span class="lab">TICKET · Nº ${String(coins.length - i).padStart(6, '0')}</span>${k.stream ? '<span class="chip">on air</span>' : ''}</div>
      ${k.image_uri ? `<img class="face" src="${esc(k.image_uri)}" alt="">` : '<img class="face" alt="">'}
      <div class="tear"></div>
      <div class="t">$${esc(k.ticker)}</div>
      <div class="m">${esc(k.name)} · $${esc(k.pair || '—')}${pct == null ? '' : ` · ${pct}% to graduation`}</div>
    </a>`;
  }).join('') + `<div class="next"><div><b>Next one?</b><div style="font-size:13.5px;margin-top:8px">Mention <span class="mono">@pairoobot</span> with a name, a ticker and a pair.</div></div></div>`;
  show('creator');
}
main();
</script>
</body>
</html>
