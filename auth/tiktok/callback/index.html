<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pairoo — TikTok authorization callback</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --fg:#e8eaed; --mut:#9aa0a6; --card:#171a21; --line:#262b34; --ok:#31c48d; --err:#f98080; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; display:flex; justify-content:center; padding:40px 20px; }
  main { width:100%; max-width:620px; }
  h1 { font-size:19px; margin:0 0 6px; }
  p.sub { color:var(--mut); margin:0 0 26px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .rot { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); margin-bottom:8px; }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; word-break:break-all; display:block; }
  button { font:inherit; background:#2b3240; color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:7px 13px; cursor:pointer; margin-top:10px; }
  button:hover { background:#333c4d; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .aviso { font-size:13px; color:var(--mut); border-left:2px solid var(--line); padding-left:12px; }
</style>
<main>
  <h1>TikTok authorization callback</h1>
  <p class="sub">This page stores nothing and sends nothing. The code appears on your screen only.</p>
  <div id="out"></div>
  <p class="aviso">The code expires within minutes and works once. Copy it and exchange it now.</p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const fields = [
    ["code", "Authorization code"],
    ["auth_code", "Authorization code (auth_code)"],
    ["state", "State — check it matches the one you generated"],
    ["scopes", "Granted scopes"],
    ["error", "Error"],
    ["error_description", "Error description"],
  ];
  const out = document.getElementById("out");
  let found = false;
  for (const [key, label] of fields) {
    const v = q.get(key);
    if (!v) continue;
    found = true;
    const card = document.createElement("div");
    card.className = "card";
    const head = document.createElement("div");
    head.className = "rot" + (key.startsWith("error") ? " err" : "");
    head.textContent = label;
    const body = document.createElement("code");
    body.textContent = v;
    card.append(head, body);
    if (key === "code" || key === "auth_code") {
      const b = document.createElement("button");
      b.textContent = "Copy";
      b.onclick = () => navigator.clipboard.writeText(v).then(() => { b.textContent = "Copied"; b.className = "ok"; });
      card.append(b);
    }
    out.append(card);
  }
  if (!found) {
    const card = document.createElement("div");
    card.className = "card";
    const head = document.createElement("div");
    head.className = "rot";
    head.textContent = "No parameters";
    const body = document.createElement("code");
    body.textContent = "TikTok returned neither a code nor an error. Start the authorization again from the app URL.";
    card.append(head, body);
    out.append(card);
  }
</script>
