<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FBF4E4">
<title>Board — Pairoobot</title>
<meta name="description" content="What is launching right now through Pairoobot, across every chain — sorted by progress, by activity, by time.">
<meta property="og:title" content="Pairoobot board">
<meta property="og:description" content="Every coin launched through Pairoobot, across every chain, live.">
<meta property="og:image" content="https://www.pairoo.xyz/assets/og-soft.webp">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF4E4;--paper-2:#F5ECD7;--yellow:#FFC91E;--yellow-soft:#FFE9A6;--ink:#14161A;--ink-70:rgba(20,22,26,.7);--ink-45:rgba(20,22,26,.6);--hair:rgba(20,22,26,.14);--hair-2:rgba(20,22,26,.26);--live:#E5484D;--disp:'Archivo Black',Impact,'Arial Black',sans-serif;--sans:Archivo,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15.5px/1.7 var(--sans);font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.wrap{width:min(1180px,calc(100% - 48px));margin:auto}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:400;letter-spacing:-.035em;line-height:1}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-45)}
.mono{font-family:var(--mono)}
header{position:sticky;top:0;z-index:60;background:rgba(251,244,228,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.head-in{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{position:relative;display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:19px;letter-spacing:-.045em}
.brand img.mk{width:26px;height:26px;display:block}
.brand .crown{position:absolute;left:17px;top:-11px;width:21px;opacity:.75;transform:rotate(-8deg)}
nav{display:flex;align-items:center;gap:26px}
nav a.nav-link{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-70)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:1px solid var(--ink);border-radius:2px;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11px;letter-spacing:.1em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--hair-2)}
.btn.ghost:hover,.btn.ghost[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:10px}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:2px 8px;border:1px solid var(--hair-2);border-radius:2px;color:var(--ink-70);background:var(--paper-2);white-space:nowrap}
.pill.pair{color:var(--ink);border-color:rgba(255,201,30,.8);background:var(--yellow-soft)}

/* the tape */
.tape{background:var(--ink);color:var(--paper);padding:18px 0;overflow:hidden;border-bottom:1px solid var(--hair)}
.tape-in{display:flex;width:max-content;font-family:var(--mono);font-size:13px;letter-spacing:.06em;animation:tape 40s linear infinite}
.tape-in>div{display:flex;gap:44px;padding-right:44px}
.tape b{color:var(--yellow);font-weight:700}
.tape .on{color:var(--live)}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tape:hover .tape-in{animation-play-state:paused}

.top{padding:56px 0 0;display:grid;grid-template-columns:1fr 260px;gap:40px;align-items:end}
h1{font-size:clamp(38px,6.4vw,80px);line-height:.98;margin-top:14px}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--yellow) 62%)}
.top img.bird{height:200px;justify-self:end;display:block}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:32px 0 22px}
.ctl .sep{width:1px;height:22px;background:var(--hair-2);margin:0 8px}

/* rows */
.head-row,.row{display:grid;grid-template-columns:minmax(230px,1fr) 120px 130px 150px 120px;gap:18px;align-items:center}
.head-row{padding:0 0 10px;border-bottom:1px solid var(--hair-2)}
.row{padding:20px 0;border-bottom:1px solid var(--hair)}
.row:hover{background:rgba(255,201,30,.07)}
.coin{display:flex;align-items:center;gap:14px;min-width:0}
.coin img{width:48px;height:48px;border-radius:6px;object-fit:cover;background:var(--paper-2);border:1px solid var(--hair-2);flex:none}
.coin .t{font-family:var(--disp);font-size:24px;letter-spacing:-.04em;line-height:1.1;word-break:break-all}
.coin .n{font-size:13px;color:var(--ink-45);line-height:1.3}
.chip{display:inline-block;font-family:var(--disp);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--live);border:2px solid var(--live);border-radius:3px;padding:1px 5px;vertical-align:2px;margin-left:8px}
.venue{display:inline-flex;align-items:center;gap:7px}
.venue img{width:16px;height:16px;border-radius:3px}
.bar{height:10px;border:1px solid var(--hair-2);border-radius:2px;background:var(--paper-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .6s}
.num{font-family:var(--mono);font-size:11.5px;color:var(--ink-45)}
.right{text-align:right}
.src{font-family:var(--mono);font-size:11px;color:var(--ink-45);margin-top:16px}
.void{padding:70px 0;text-align:center}
.void b{display:block;font-family:var(--disp);font-size:clamp(22px,3.2vw,34px);letter-spacing:-.04em;margin-bottom:12px}
.void span{font-family:var(--mono);font-size:11.5px;opacity:.6}
.end{padding:96px 0 100px;text-align:center}
.end h2{font-size:clamp(30px,4.6vw,54px);margin-bottom:14px}
.end .swash{display:block;width:min(240px,52%);margin:0 auto 30px;opacity:.7}
footer{border-top:1px solid var(--hair);padding:28px 0 46px}
.foot-in{display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-45)}
.foot-links{display:flex;flex-wrap:wrap;gap:16px}
@media (max-width:900px){
  .top{grid-template-columns:1fr}.top img.bird{display:none}
  .head-row{display:none}
  .row{grid-template-columns:1fr;gap:10px;padding:18px 0}
  .row .right{text-align:left}
  nav .nav-link{display:none}
}
@media (prefers-reduced-motion:reduce){.tape-in{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<header><div class="wrap head-in">
  <a class="brand" href="/"><img class="crown" src="/assets/mark-crown.webp" alt=""><img class="mk" src="/assets/mark.webp" alt="" width="30" height="30">Pairoobot</a>
  <nav><a class="nav-link" href="/#pairs">Pairs</a><a class="nav-link" href="/#fees">Fees</a><a class="btn" href="https://t.me/pairoobot" target="_blank" rel="noopener noreferrer">@pairoobot</a></nav>
</div></header>

<div class="tape" id="tape" hidden><div class="tape-in" id="tape-in"></div></div>

<main class="wrap">
  <div class="top">
    <div><div class="lab">BOARD · EVERY CHAIN</div><h1>What is <em>launching</em> now.</h1></div>
    <img class="bird" src="/assets/bird-clean.webp" alt="">
  </div>
  <div class="ctl">
    <span class="lab" style="margin-right:4px">CHAIN</span>
    <button class="btn ghost sm" data-chain="all" aria-pressed="true">all</button>
    <button class="btn ghost sm" data-chain="robinhood">Robinhood</button>
    <button class="btn ghost sm" data-chain="solana">Solana</button>
    <button class="btn ghost sm" data-chain="bsc">BNB</button>
    <span class="sep"></span>
    <span class="lab" style="margin-right:4px">SORT</span>
    <button class="btn ghost sm" data-sort="recent" aria-pressed="true">newest</button>
    <button class="btn ghost sm" data-sort="progress">closest to graduating</button>
    <button class="btn ghost sm" data-sort="live">on air first</button>
  </div>
  <div id="body"><div class="void"><b>Reading the feed…</b></div></div>
  <p class="src" id="src"></p>
  <section class="end"><h2>Same bird<br>bigger ideas</h2><img class="swash" src="/assets/mark-swash.webp" alt=""><a class="btn" href="https://t.me/pairoobot" target="_blank" rel="noopener noreferrer">Launch yours</a></section>
</main>

<footer><div class="wrap foot-in">
  <span>© 2026 Pairoobot</span>
  <div class="foot-links"><a href="/pairoo/terms">Terms</a><a href="/pairoo/privacy">Privacy</a><a href="/pairoo/data-deletion">Data deletion</a><a href="https://t.me/pairoobot" target="_blank" rel="noopener noreferrer">Telegram @pairoobot</a></div>
</div></footer>

<script type="module">
import { readRobinhood, fmtNum } from '/coin/coin.js';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let coins = [], chain = 'all', sort = 'recent';
const live = new Map();
const progressOf = (c) => { const l = live.get(c.mint); return l ? l.progress : c.bonding_progress; };

function tape() {
  if (!coins.length) return;
  // The tape is the same coins, running. Nothing on it is invented: a coin with
  // no progress yet shows a dash rather than a number.
  const one = coins.map((c) => {
    const p = progressOf(c);
    return `<span>$${esc(c.ticker)} <b>${p == null ? '—' : Math.round(p * 100) + '%'}</b> vs $${esc(c.pair || '—')}${c.stream ? ' · <span class="on">● ON AIR</span>' : ''}</span>`;
  }).join('');
  // Two identical halves make the -50% loop seamless; repeat short lists so the
  // strip is at least as wide as the screen.
  const times = Math.max(1, Math.ceil(9 / coins.length));
  const half = `<div>${one.repeat(times)}</div>`;
  $('tape-in').innerHTML = half + half;
  $('tape').hidden = false;
}

function paint() {
  let rows = coins.filter((c) => chain === 'all' || c.chain === chain);
  rows.sort((a, b) => sort === 'progress' ? ((progressOf(b) ?? -1) - (progressOf(a) ?? -1))
    : sort === 'live' ? ((b.stream ? 1 : 0) - (a.stream ? 1 : 0)) || ((b.created_at || 0) - (a.created_at || 0))
    : (b.created_at || 0) - (a.created_at || 0));
  if (!rows.length) {
    $('body').innerHTML = `<div class="void"><b>Nothing here yet.</b><span>the first confirmed launch on this chain appears the moment it exists</span></div>`;
    return;
  }
  $('body').innerHTML = `<div class="head-row"><span class="lab">COIN</span><span class="lab">PAIR</span><span class="lab">CHAIN</span><span class="lab">TO GRADUATION</span><span class="lab right">LAUNCHED</span></div>` +
    rows.map((c) => {
      const l = live.get(c.mint), p = progressOf(c);
      const pct = p == null ? null : Math.round(p * 1000) / 10;
      const when = c.created_at ? new Date(c.created_at * 1000).toLocaleDateString('en-US', { dateStyle: 'medium' }) : '—';
      const raised = l ? `${fmtNum(l.raised)} / ${fmtNum(l.target)} ${esc(l.pairSymbol)}`
        : (c.market_cap_usd != null ? '$' + fmtNum(c.market_cap_usd, 0) + ' mcap' : 'from the feed');
      return `<a class="row" href="/coin/${encodeURIComponent(c.mint)}">
        <span class="coin">${c.image_uri ? `<img src="${esc(c.image_uri)}" alt="">` : '<img alt="">'}<span style="min-width:0"><span class="t">$${esc(c.ticker)}${c.stream ? '<span class="chip">on air</span>' : ''}</span><span class="n" style="display:block">${esc(c.name)}</span></span></span>
        <span><span class="pill pair">vs $${esc(c.pair || '—')}</span></span>
        <span class="venue"><img src="/assets/icon-${esc(c.chain === 'robinhood' ? 'robinhood' : c.chain === 'bsc' ? 'bsc' : 'solana')}.webp" alt=""><span class="mono" style="font-size:11px">${esc(c.chain_label || c.chain)}</span></span>
        <span><span class="bar"><i style="width:${pct ?? 0}%"></i></span><span class="num" style="display:block;margin-top:5px">${pct == null ? '—' : pct + '%'}${l && l.status !== 'on the curve' ? ' · ' + esc(l.status) : ''} · ${raised}</span></span>
        <span class="num right">${esc(when)}</span></a>`;
    }).join('');
}

async function refreshLive() {
  // One coin at a time, spaced out: the public RPC throttles bursts, and a long
  // board must never be the thing that trips it.
  const rh = coins.filter((c) => c.chain === 'robinhood').slice(0, 40);
  let block = null;
  for (const c of rh) {
    try { const r = await readRobinhood(c.mint); if (r) { live.set(c.mint, r.state); block = r.block; paint(); tape(); } } catch { /* next coin */ }
    await new Promise((res) => setTimeout(res, 350));
  }
  $('src').textContent = `${coins.length} coin${coins.length === 1 ? '' : 's'} on chain · `
    + (rh.length ? `Robinhood rows read live${block ? ' · block ' + block.toLocaleString('en-US') : ''}` : 'no Robinhood coin yet')
    + ' · Solana rows show what the feed captured at build';
  setTimeout(refreshLive, 30000);
}

for (const b of document.querySelectorAll('[data-chain]')) b.addEventListener('click', () => {
  chain = b.dataset.chain;
  for (const x of document.querySelectorAll('[data-chain]')) x.setAttribute('aria-pressed', String(x === b));
  paint();
});
for (const b of document.querySelectorAll('[data-sort]')) b.addEventListener('click', () => {
  sort = b.dataset.sort;
  for (const x of document.querySelectorAll('[data-sort]')) x.setAttribute('aria-pressed', String(x === b));
  paint();
});
fetch('/pairoo/api/coins.json', { cache: 'no-store' }).then((r) => r.json())
  .then((d) => { coins = d.coins || []; paint(); tape(); refreshLive(); })
  .catch(() => { $('body').innerHTML = `<div class="void"><b>Feed unavailable.</b><span>the coin list could not be read right now</span></div>`; });
</script>
</body>
</html>
